# =============================================================================
#  nginx server block for the AI Campus Opportunity Agent site
#  File inside the container: /etc/nginx/conf.d/default.conf
#
#  Serves the static site from /usr/share/nginx/html on port 80.
#  In the Docker setup this port is reached in two ways:
#    1. From your Windows browser  -> http://localhost:8080  (port published in
#       docker-compose.yml; the container's 80 is mapped to the host's 8080)
#    2. From the Cloudflare tunnel  -> http://web:80  (container name on the
#       internal Docker network; no host port involved)
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ---- gzip (smaller downloads for the CSS/JS) ----------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      image/svg+xml;

    # ---- Response headers ---------------------------------------------------
    # These are set at server level on purpose: nginx only inherits add_header
    # into a `location` block when that block defines no add_header of its own,
    # so keeping them here means every response (including 404s) gets them.
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header X-Frame-Options        "SAMEORIGIN"                   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ---- Health endpoint used by HEALTHCHECK / compose ----------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- index.html must always be revalidated ------------------------------
    # "expires epoch" sends Cache-Control: no-cache, so a redeploy of the site
    # shows up immediately instead of a stale page from the browser cache.
    location = /index.html {
        expires epoch;
    }

    # ---- Static assets: cache for one hour ---------------------------------
    location ~* \.(?:css|js|mjs|svg|ico|png|jpe?g|gif|webp|avif|woff2?)$ {
        expires 1h;
        access_log off;
    }

    # ---- Everything else ----------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- Errors -------------------------------------------------------------
    error_page 404 /404.html;   # falls back to nginx's own page if absent
}
